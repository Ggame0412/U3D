name: Build U3D

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / openSUSE Leap
    runs-on: ubuntu-24.04
    container:
      image: opensuse/leap:16.0

    steps:
      - name: Install dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install git cmake ninja gcc gcc-c++ make pkg-config libX11-devel libXext-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel libXxf86vm-devel Mesa-libGL-devel SDL2-devel zlib-devel

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: u3d-opensuse-leap
          path: install/